baseURL: https://thedeepstack.dev/
locale: en-US
title: The Deep Stack
copyright: © 2026 The Deep Stack
enableRobotsTXT: true
enableGitInfo: true

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

outputs:
  home:
    - HTML
    - RSS

pagination:
  pagerSize: 8

taxonomies:
  topic: topics

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github-dark

caches:
  images:
    dir: :cacheDir/images

params:
  description: Deep technical writing, performance engineering, correctness reviews, and production architecture.
  author: Rohit Jha
  contactEmail: hello@thedeepstack.dev
  kitFormAction: ""
  mainSections:
    - writing
  social:
    linkedin: ""
    github: ""

menus:
  main:
    - name: Writing
      pageRef: /writing
      weight: 10
    - name: Advisory
      pageRef: /advisory
      weight: 20
    - name: Workshops
      pageRef: /workshops
      weight: 30
    - name: About
      pageRef: /about
      weight: 40
    - name: Subscribe
      pageRef: /newsletter
      weight: 50
