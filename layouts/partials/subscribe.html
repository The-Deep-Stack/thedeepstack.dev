<section class="newsletter-panel" aria-labelledby="newsletter-title">
  <div>
    <div class="section-kicker signal">The Deep Stack Dispatch</div>
    <h2 id="newsletter-title">Build deeper engineering judgment.</h2>
    <p>New investigations, field notes, and practical frameworks—sent occasionally, when there is something worth reading.</p>
  </div>
  {{ if site.Params.kitFormAction }}
    <form class="subscribe-form" action="{{ site.Params.kitFormAction }}" method="post">
      <label class="sr-only" for="newsletter-email">Email address</label>
      <input id="newsletter-email" name="email_address" type="email" autocomplete="email" placeholder="you@company.com" required>
      <button type="submit">Subscribe →</button>
    </form>
  {{ else }}
    <a class="button primary newsletter-button" href="/newsletter/">Join the dispatch →</a>
  {{ end }}
</section>
